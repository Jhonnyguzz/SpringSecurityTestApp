spring:
  application:
    name: SpringSecurityTestApp
  datasource:
    url: jdbc:h2:mem:songsdb
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:replace-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:replace-me}
            scope: openid, profile, email
          github:
            client-id: ${GITHUB_CLIENT_ID:replace-me}
            client-secret: ${GITHUB_CLIENT_SECRET:replace-me}
            scope: read:user, user:email
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.epam.springsecuritytestapp: DEBUG
    # Set to DEBUG or TRACE to see every security filter and decision
    org.springframework.security: INFO
